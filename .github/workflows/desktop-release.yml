name: Desktop release

# Builds the desktop installers for all three platforms, signed if the matching
# repository secrets exist and unsigned if they don't — so this template works
# as-is today and starts signing the moment you add secrets, with no edit here.
#
# Separate from ci.yml on purpose. That workflow deliberately skips the electron
# workspace because its postinstall pulls a ~350 MB Chromium; this one needs it,
# on three runners, so it stays off the per-push path.
#
# Secrets to add (Settings → Secrets and variables → Actions), all optional:
#
#   Windows  AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#            — or WIN_CSC_LINK (base64 .pfx) + WIN_CSC_KEY_PASSWORD
#   macOS    CSC_LINK (base64 .p12), CSC_KEY_PASSWORD,
#            APPLE_API_KEY_P8 (contents of the .p8), APPLE_API_KEY_ID,
#            APPLE_API_ISSUER
#
# The non-secret Azure account names go in electron/signing.config.cjs, or as
# repository *variables* of the same name — see the Windows build step.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the installers to a GitHub release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      # One platform's signing problem shouldn't throw away the other two
      # installers, which take ten minutes each to rebuild.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # electron-builder names every artifact from the root package.json, not
      # from the tag. Catching the mismatch here beats finding `Scibrarian Setup
      # 0.5.0.exe` attached to a release called v0.6.0.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      # Full install, electron workspace included — that Chromium download is
      # the thing being packaged.
      - name: Install
        run: npm ci

      # @electron/notarize passes APPLE_API_KEY to notarytool as `--key`, so it
      # has to be a path on disk. The secret holds the file's contents; this
      # writes it out and points the variable at it.
      #
      # Written under a 077 umask rather than chmod'd afterwards, so it is never
      # briefly world-readable. See the removal step after the build for why a
      # live Apple credential on this runner is worth being careful with.
      - name: Stage the App Store Connect API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "No APPLE_API_KEY_P8 secret set — this build will not be notarized."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          chmod 700 "$RUNNER_TEMP/private_keys"
          ( umask 077; printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey.p8" )
          echo "APPLE_API_KEY=$RUNNER_TEMP/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      # Three build steps rather than one with everything in scope: each
      # platform sees only its own credentials, so a half-configured Azure
      # account can't fail the macOS job.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm run desktop:dist
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Not secrets — repository variables, so they can also just live in
          # electron/signing.config.cjs. Unset here, the file's values are used.
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
          AZURE_ENDPOINT: ${{ vars.AZURE_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          # Only used when the Azure credentials are absent.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # `--universal` because macos-latest is arm64, and a default build there
      # produces a dmg that silently won't run on any Intel Mac. Roughly double
      # the size; drop the flag if you don't care about Intel. Both `--` are
      # load-bearing — see DESKTOP.md § Architecture.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npm run desktop:dist -- -- --universal
        env:
          # An unset secret arrives here as "", not as nothing, and
          # electron-builder's macOS path would treat that empty string as a
          # certificate path and fail the build. electron/signing.config.cjs
          # deletes blank signing variables before it can — don't hand these to
          # electron-builder by some route that skips that file.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # APPLE_API_KEY is the path exported by the staging step above.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # On a GitHub-hosted runner the whole machine is discarded and this is
      # redundant. On a self-hosted one it is not: self-hosted macOS runners are
      # the usual way to avoid the 10x macOS minute multiplier, and there
      # RUNNER_TEMP survives the job. A live Apple signing key at a predictable
      # path would then be readable by whatever runs next on that box, including
      # a job from another repository sharing the runner. `always()` because a
      # failed build is exactly when you least want it left behind.
      - name: Remove the App Store Connect API key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npm run desktop:dist

      - uses: actions/upload-artifact@v4
        with:
          name: scibrarian-${{ matrix.name }}
          # electron-builder writes unpacked directories here too; only the
          # installable outputs are worth carrying.
          path: |
            electron/dist/*.exe
            electron/dist/*.dmg
            electron/dist/*.AppImage
            electron/dist/*.blockmap
            electron/dist/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # On a tag push the tag is the name. On a manual run the ref is a branch,
      # so fall back to the version the installers were actually stamped with —
      # `gh release create` will create the tag at this commit.
      - name: Work out the release tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      # `gh` is preinstalled on the runner, so this needs no third-party action.
      # A draft, because installers are worth downloading and launching once
      # before anyone else gets them. Re-running the workflow uploads into the
      # existing draft rather than failing on a duplicate tag.
      #
      # Only into a *draft*, though. On a manual run the tag is derived from
      # package.json, which still reads the last released version until the next
      # release bumps it — so a dispatch from master resolves to a tag that has
      # already shipped, and `--clobber` would replace installers people have
      # downloaded with a fresh build from unmerged commits, under an unchanged
      # version number. Nothing upstream catches it: the tag-vs-package.json
      # check only runs on tag pushes.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::$TAG is already published — refusing to overwrite its assets."
              echo "Bump the version in package.json and tag again, or delete the release first."
              exit 1
            fi
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber artifacts/*
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --generate-notes \
              --title "$TAG" \
              artifacts/*
          fi
